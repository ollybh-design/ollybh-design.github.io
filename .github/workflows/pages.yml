name: Publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unzip the site
        run: |
          unzip -q portfolio-github.zip -d build
          touch build/portfolio/.nojekyll
      - name: Add the On Display project page
        run: cp -r on-display build/portfolio/on-display
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/portfolio
      - id: deployment
        uses: actions/deploy-pages@v4
